name: Build Debug APK

# Este flujo compila el proyecto y publica el APK de depuración como artefacto descargable.
# Se ejecuta automáticamente al hacer push a main/master o manualmente desde la pestaña Actions en GitHub.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK y Licencias
        run: |
          # En ubuntu-latest el Android SDK ya viene preinstalado en /usr/local/lib/android/sdk
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Aceptar licencias del SDK automáticamente
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
            # Asegurar que la plataforma de compilación 36 esté disponible
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>/dev/null || true
          fi

      - name: Configurar archivos de entorno
        run: |
          # Asegurar que .env exista para el Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Asegurar Keystore de depuración
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generando debug.keystore de respaldo..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # No bloquea la entrega del APK si alguna prueba falla en CI
      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      # Cada corrida usa un versionCode ascendente para permitir actualización directa en Android
      - name: Compilar APK de depuración
        run: gradle assembleDebug --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-tdc-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

