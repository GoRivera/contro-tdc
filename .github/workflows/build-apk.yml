name: Build Debug APK

# Este flujo compila el proyecto y publica el APK de depuración como artefacto descargable.
# Se ejecuta automáticamente al hacer push a main/master o manualmente desde la pestaña Actions en GitHub.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar archivos de entorno
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Aceptar licencias de Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          mkdir -p "$SDK_ROOT/licenses" 2>/dev/null || sudo mkdir -p "$SDK_ROOT/licenses"
          sudo chmod -R 777 "$SDK_ROOT/licenses" 2>/dev/null || true
          printf "24333f8a63b1d7f2e51f81648a3eb180e1a021ee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$SDK_ROOT/licenses/android-sdk-license" > /dev/null
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n5046274c46de7009618bc4b9f7dd729f60073a35\n" | sudo tee "$SDK_ROOT/licenses/android-sdk-preview-license" > /dev/null

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Asegurar Keystore persistente
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -di debug.keystore.base64 > debug.keystore
          fi
          # Verificación informativa de la huella digital
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1|SHA256" || true

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-tdc-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
