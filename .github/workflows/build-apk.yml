name: Build Debug APK

# Este flujo compila el proyecto y publica el APK de depuración como artefacto descargable.
# Se ejecuta automáticamente al hacer push a main/master o manualmente desde la pestaña Actions en GitHub.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar archivos de entorno
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Configurar Android SDK y Licencias
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Asegurar permisos de escritura sobre el SDK en el runner
          sudo chown -R "$USER:$USER" "$ANDROID_HOME" 2>/dev/null || true

          # Pre-aprobar licencias del SDK mediante hashes oficiales
          sudo mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || mkdir -p "$ANDROID_HOME/licenses"
          sudo chmod -R 777 "$ANDROID_HOME/licenses" 2>/dev/null || true
          printf "24333f8a63b1d7f2e51f81648a3eb180e1a021ee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n5046274c46de7009618bc4b9f7dd729f60073a35\n" | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null

          # Aceptar licencias interactivas si sdkmanager está disponible
          SDK_MGR=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses 2>/dev/null || true
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar Keystore de depuración persistente
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restaurando debug.keystore persistente desde debug.keystore.base64..."
            base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          echo "=== Huellas digitales del certificado de firma del APK ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      # Cada corrida usa un versionCode ascendente para permitir actualización directa en Android
      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace -PappVersionCode=${{ github.run_number }}

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-tdc-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
