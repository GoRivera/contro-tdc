name: Build Debug APK

# Este flujo compila el proyecto y publica el APK de depuración como artefacto descargable.
# Se agregó porque el entorno local usado para corregir el código no pudo compilar el proyecto
# (un problema de sockets Unix-domain de Java NIO específico de esa máquina Windows, no del código).
# Súbelo a un repositorio en GitHub y este flujo corre automáticamente.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Generar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generar keystore de depuración
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de depuración
        run: gradle assembleDebug --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-tdc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
