name: Build Debug APK

# Este flujo compila el proyecto y publica el APK de depuración como artefacto descargable.
# Se agregó porque el entorno local usado para corregir el código no pudo compilar el proyecto
# (un problema de sockets Unix-domain de Java NIO específico de esa máquina Windows, no del código).
# Súbelo a un repositorio en GitHub y este flujo corre automáticamente.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Generar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # No bloquea la generación del APK (continue-on-error): son pruebas nuevas sobre lógica de
      # fechas/MSI que antes no tenían cobertura, pero el proyecto también incluye una prueba de
      # captura de pantalla (Robolectric/Roborazzi) cuya compatibilidad con el entorno de CI no se
      # ha validado todavía, y no debe impedir la entrega del APK si falla por eso.
      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      # Nota: debug.keystore va versionado en el repo a propósito (ver .gitignore).
      # Antes este paso generaba un keystore NUEVO en cada corrida, con una huella
      # SHA-1 distinta cada vez, lo que rompía el inicio de sesión con Google (la
      # huella del APK ya no coincidía con la registrada en Firebase/Google Cloud).

      # Cada corrida usa un versionCode ascendente (el número de la propia corrida de CI) para
      # que los APKs generados se puedan instalar unos sobre otros como actualización normal,
      # en vez de quedar "empatados" en el mismo versionCode.
      - name: Compilar APK de depuración
        run: gradle assembleDebug --stacktrace "-PappVersionCode=${{ github.run_number }}"

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: control-tdc-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
